name: Agentic configuration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated agentic config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated files and standalone safety
        run: python3 .github/scripts/check-agentic-config.py
